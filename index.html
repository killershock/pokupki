<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Покупки</title>
<meta name="description" content="Список покупок голосом: сказал «молоко, хлеб, сыр» — три пункта в списке." />
<meta name="theme-color" content="#eef2ef" />
<meta name="color-scheme" content="light" />
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="icon" href="./icons/favicon-32.png" sizes="32x32" />
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Покупки" />
<style>
  :root {
    --bg: #eef2ef;
    --card: #ffffff;
    --ink: #16211b;
    --ink-soft: #48564d;
    --muted: #7f8d84;
    --accent: #1f6f52;
    --accent-dark: #175a42;
    --accent-soft: #dcefe4;
    --line: #e2e9e4;
    --line-strong: #cfdad3;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background:
      radial-gradient(90% 50% at 100% 0%, rgba(31, 111, 82, 0.07), transparent 60%),
      var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    overscroll-behavior-y: none;
  }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  .app { max-width: 520px; margin: 0 auto; padding: 0 20px calc(150px + var(--safe-bottom)); min-height: 100dvh; }
  .is-hidden { display: none !important; }

  /* ---------- верх ---------- */
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 26px 0 4px; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .bag {
    width: 44px; height: 44px; border-radius: 14px;
    background: var(--accent); color: #fff;
    display: grid; place-items: center;
    box-shadow: 0 10px 22px rgba(31, 111, 82, 0.22);
  }
  .kicker { font-size: 10.5px; letter-spacing: 1.4px; text-transform: uppercase; color: var(--muted); }
  h1 { margin: 2px 0 0; font-size: 25px; font-weight: 700; letter-spacing: -0.4px; }
  .share {
    display: inline-flex; align-items: center; gap: 7px;
    background: var(--card); color: var(--accent);
    border: 1px solid var(--line);
    border-radius: 999px; padding: 9px 14px;
    font-size: 12.5px; font-weight: 600;
    box-shadow: 0 4px 12px rgba(22, 33, 27, 0.05);
  }
  .share:active { background: var(--accent-soft); }

  /* ---------- заголовки разделов ---------- */
  .section { margin-top: 22px; }
  .section-head {
    display: flex; align-items: center; gap: 8px;
    font-size: 10.5px; letter-spacing: 1.4px; text-transform: uppercase;
    color: var(--muted); font-weight: 600;
    margin-bottom: 10px; padding: 0 2px;
  }
  .section-head b {
    font-size: 11px; color: var(--accent); background: var(--accent-soft);
    border-radius: 999px; padding: 2px 8px; letter-spacing: 0;
  }

  /* ---------- карточки покупок ---------- */
  .list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .item {
    display: grid; grid-template-columns: 26px 1fr 30px; gap: 12px; align-items: center;
    background: var(--card); border: 1px solid var(--line);
    border-radius: 14px; padding: 13px 12px 13px 14px;
    box-shadow: 0 4px 12px rgba(22, 33, 27, 0.045);
    animation: card-in 0.22s ease;
  }
  @keyframes card-in { from { transform: translateY(-4px) scale(.995); } to { transform: none; } }
  .check {
    width: 24px; height: 24px; border-radius: 8px;
    border: 1.5px solid var(--line-strong); background: #fff;
    display: grid; place-items: center; color: transparent;
    transition: background .16s, border-color .16s, color .16s;
  }
  .item.done .check { background: var(--accent); border-color: var(--accent); color: #fff; animation: tick .26s cubic-bezier(.2,1.4,.4,1); }
  @keyframes tick { 0% { transform: scale(.7); } 60% { transform: scale(1.12); } 100% { transform: scale(1); } }
  .item.is-leaving { opacity: 0; transform: translateX(14px) scale(.98); transition: opacity .17s ease, transform .17s ease; }
  @keyframes bump { 0% { transform: scale(1); } 45% { transform: scale(1.35); } 100% { transform: scale(1); } }
  .section-head b.is-bump { animation: bump .3s ease; }
  .art { animation: bob 3.4s ease-in-out infinite; }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
  .item-text { font-size: 15.5px; line-height: 1.3; font-weight: 500; }
  .item-qty {
    font-size: 11.5px; font-weight: 600; color: var(--accent);
    background: var(--accent-soft); border-radius: 999px; padding: 2px 8px; margin-left: 7px;
  }
  .item.done .item-text { color: var(--muted); font-weight: 400; text-decoration: line-through; text-decoration-color: var(--line-strong); }
  .item.done .item-qty { color: var(--muted); background: #f1f4f2; }
  .item-del { color: var(--muted); opacity: .45; display: flex; justify-content: flex-end; }
  .item-del:active { opacity: 1; color: #b4472e; }

  /* ---------- пусто ---------- */
  .empty { text-align: center; padding: 40px 10px 10px; }
  .empty .art { width: 64px; height: 64px; margin: 0 auto 14px; color: var(--accent); opacity: .9; }
  .empty h2 { margin: 0; font-size: 18px; font-weight: 700; letter-spacing: -0.2px; }
  .empty p { margin: 7px auto 18px; max-width: 290px; font-size: 12.8px; line-height: 1.55; color: var(--ink-soft); }
  .examples { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .example {
    background: var(--card); border: 1px solid var(--line); color: var(--ink-soft);
    font-size: 12px; padding: 8px 12px; border-radius: 999px;
  }

  .clear-done {
    display: block; margin: 14px auto 0; font-size: 12px; font-weight: 600;
    color: var(--muted); text-decoration: underline; text-underline-offset: 3px;
  }

  .clear-all {
    display: block; margin: 26px auto 0; padding: 11px 18px;
    border: 1px solid var(--line); border-radius: 12px;
    background: var(--card); color: var(--muted);
    font-size: 12.5px; font-weight: 600;
    transition: background .18s ease, color .18s ease, border-color .18s ease, transform .12s ease;
  }
  .clear-all:active { transform: scale(.97); }
  .clear-all.armed {
    background: #fdecea; border-color: #f3c3bb; color: #b4472e;
    animation: bump .3s ease;
  }

  /* ---------- ввод ---------- */
  .composer {
    position: fixed; left: 0; right: 0; bottom: 0; max-width: 520px; margin: 0 auto;
    display: flex; align-items: center; gap: 10px;
    padding: 14px 20px calc(18px + var(--safe-bottom));
    background: linear-gradient(180deg, rgba(238, 242, 239, 0) 0%, var(--bg) 45%);
  }
  .field {
    flex: 1; min-width: 0; display: flex; align-items: center;
    background: var(--card); border: 1px solid var(--line);
    border-radius: 999px; padding: 0 16px;
    box-shadow: 0 6px 18px rgba(22, 33, 27, 0.07);
  }
  .field input {
    flex: 1; min-width: 0; border: 0; background: transparent; outline: none;
    padding: 14px 0; font-size: 14px;
  }
  .field input::placeholder { color: var(--muted); }
  .mic {
    position: relative;
    flex: 0 0 54px; width: 54px; height: 54px; border-radius: 50%;
    background: var(--accent); color: #fff;
    display: grid; place-items: center;
    box-shadow: 0 10px 22px rgba(31, 111, 82, 0.26);
    transition: transform .14s ease, background .2s ease;
  }
  .mic.listening { background: var(--accent-dark); transform: scale(.95); box-shadow: 0 0 0 8px rgba(31, 111, 82, 0.12); }
  .mic.listening::after {
    content: ""; position: absolute; width: 54px; height: 54px; border-radius: 50%;
    border: 1px solid rgba(31, 111, 82, 0.5); animation: pulse 1.8s ease-out infinite;
  }
  @keyframes pulse { from { transform: scale(1); opacity: .6; } to { transform: scale(1.6); opacity: 0; } }

  /* ---------- прослушивание ---------- */
  .overlay {
    position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; padding: 22px;
    background: rgba(22, 33, 27, 0.45); backdrop-filter: blur(6px);
  }
  .listen-card {
    width: 100%; max-width: 320px; text-align: center;
    background: var(--card); border-radius: 22px; padding: 28px 22px 20px;
    box-shadow: 0 26px 54px rgba(22, 33, 27, 0.26);
  }
  .orb { width: 84px; height: 84px; margin: 0 auto 16px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; position: relative; }
  .orb::before, .orb::after {
    content: ""; position: absolute; inset: 0; border-radius: 50%;
    border: 1px solid rgba(31, 111, 82, 0.45); animation: pulse 2s ease-out infinite;
  }
  .orb::after { animation-delay: .7s; }
  .listen-title { margin: 0; font-size: 17px; font-weight: 700; }
  .listen-text { margin: 8px 0 6px; min-height: 38px; font-size: 13px; color: var(--ink-soft); line-height: 1.5; }
  .listen-hint { margin: 0 0 18px; font-size: 11.5px; color: var(--muted); }
  .listen-actions { display: flex; gap: 10px; }
  .btn { flex: 1; padding: 13px 14px; font-size: 13px; font-weight: 600; border-radius: 12px; }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn.ghost { background: #f2f5f3; color: var(--ink-soft); }

  .flash {
    position: fixed;
    left: 50%;
    bottom: calc(128px + var(--safe-bottom));
    z-index: 55;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 16px 12px 12px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: 0 18px 34px rgba(22, 33, 27, 0.16);
    opacity: 0;
    transform: translate(-50%, 16px) scale(0.97);
    transition: opacity 0.2s ease, transform 0.28s cubic-bezier(0.22, 1, 0.36, 1);
    pointer-events: none;
  }
  .flash.is-on { opacity: 1; transform: translate(-50%, 0) scale(1); }
  .flash-ico {
    width: 32px; height: 32px; border-radius: 10px;
    background: var(--accent-soft); color: var(--accent);
    display: grid; place-items: center;
  }
  .flash-text b { display: block; font-size: 13.5px; font-weight: 600; }
  .flash-text small {
    display: block; margin-top: 2px; font-size: 10px;
    letter-spacing: 0.8px; text-transform: uppercase; color: var(--muted);
  }

  .toast {
    position: fixed; left: 50%; bottom: calc(130px + var(--safe-bottom)); transform: translateX(-50%); z-index: 60;    max-width: min(440px, calc(100vw - 40px)); padding: 11px 15px;
    background: #1e2a23; color: #eef5f0; border-radius: 12px;
    box-shadow: 0 14px 30px rgba(22, 33, 27, 0.24);
    font-size: 12.5px; line-height: 1.45; text-align: center;
  }

  @media (prefers-reduced-motion: reduce) { * { transition-duration: .001ms !important; animation-duration: .001ms !important; } }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="bag" aria-hidden="true">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h14l-1.2 11.2a2 2 0 0 1-2 1.8H8.2a2 2 0 0 1-2-1.8L5 8Z"/><path d="M9 8V6.4a3 3 0 0 1 6 0V8"/></svg>
      </div>
      <div>
        <div class="kicker" id="today">сегодня</div>
        <h1>Покупки</h1>
      </div>
    </div>
    <button class="share" id="share" type="button">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4M8.4 7.6 12 4l3.6 3.6"/><path d="M5 13v6.5A1.5 1.5 0 0 0 6.5 21h11a1.5 1.5 0 0 0 1.5-1.5V13"/></svg>
      Отправить
    </button>
  </header>

  <div class="empty" id="empty">
    <svg class="art" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h14l-1.2 11.2a2 2 0 0 1-2 1.8H8.2a2 2 0 0 1-2-1.8L5 8Z"/><path d="M9 8V6.4a3 3 0 0 1 6 0V8"/><path d="M9.5 12.5v4M14.5 12.5v4"/></svg>
    <h2>Что купить?</h2>
    <p>Нажми микрофон и говори списком: «молоко, хлеб, сыр». Можно с количеством: «картошка 2 кг».</p>
    <div class="examples" id="examples"></div>
  </div>

  <section class="section is-hidden" id="open-section">
    <div class="section-head"><span>нужно</span><b id="left-count">0</b></div>
    <ul class="list" id="list-open"></ul>
  </section>

  <section class="section is-hidden" id="done-section">
    <div class="section-head"><span>куплено</span><b id="done-count">0</b></div>
    <ul class="list" id="list-done"></ul>
    <button class="clear-done" id="clear-done" type="button">убрать купленное</button>
  </section>

  <button class="clear-all is-hidden" id="clear-all" type="button">очистить весь список</button>
</div>

<div class="composer">
  <div class="field">
    <input id="input" type="text" placeholder="молоко, хлеб, сыр…" autocomplete="off" aria-label="Что купить" />
  </div>
  <button class="mic" id="mic" type="button" aria-label="Сказать голосом">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2.6" width="6" height="11" rx="3"/><path d="M5.6 11a6.4 6.4 0 0 0 12.8 0"/><path d="M12 17.4v3.2"/></svg>
  </button>
</div>

<div class="overlay is-hidden" id="overlay">
  <div class="listen-card">
    <div class="orb">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2.6" width="6" height="11" rx="3"/><path d="M5.6 11a6.4 6.4 0 0 0 12.8 0"/><path d="M12 17.4v3.2"/></svg>
    </div>
    <p class="listen-title" id="listen-title">Говорите…</p>
    <p class="listen-text" id="listen-text">Например: «молоко, хлеб, сыр»</p>
    <p class="listen-hint">нажми «Готово» или микрофон, когда закончишь</p>
    <div class="listen-actions">
      <button class="btn ghost" id="cancel" type="button">Отмена</button>
      <button class="btn primary" id="done" type="button">Готово</button>
    </div>
  </div>
</div>

<div class="flash" id="flash" aria-hidden="true">
  <div class="flash-ico" id="flash-ico">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.6 4.6L19 7.6"/></svg>
  </div>
  <div class="flash-text">
    <b id="flash-title"></b>
    <small id="flash-meta"></small>
  </div>
</div>

<div class="toast is-hidden" id="toast"></div>

<script>
(() => {
  'use strict';
  const KEY = 'pokupki.v1';
  const EXAMPLES = ['молоко, хлеб, сыр', 'картошка 2 кг', 'яйца, масло, чай'];

  const $ = (s) => document.querySelector(s);
  const openList = $('#list-open');
  const doneList = $('#list-done');
  const emptyEl = $('#empty');
  const inputEl = $('#input');
  const toastEl = $('#toast');
  const overlay = $('#overlay');
  const micBtn = $('#mic');

  let items = load();
  let toastTimer = null;

  // ---------- хранение ----------
  function load() {
    try {
      const raw = JSON.parse(localStorage.getItem(KEY) || 'null');
      return Array.isArray(raw && raw.items) ? raw.items : [];
    } catch (e) { return []; }
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify({ items })); } catch (e) {}
  }

  // ---------- разбор фразы ----------
  const STOP_WORDS = new Set(['купить', 'надо', 'нужно', 'ещё', 'еще', 'пожалуйста', 'добавь', 'добавить', 'в', 'список']);
  const QTY = /^(.*?)\s+(\d+(?:[.,]\d+)?)\s*(кг|г|гр|грамм|л|мл|шт|штук[аи]?|уп|упак[а-я]*|пач[а-я]*|бутыл[а-я]*|банк[а-я]*|пакет[а-я]*)$/i;

  function parseItems(raw) {
    const text = String(raw || '').replace(/ё/g, 'е').replace(/[.!?]+$/g, '');
    return text
      .split(/[,;\n]+|\s+и\s+|\s+плюс\s+/gi)
      .map((part) => part
        .split(/\s+/)
        .filter((word) => word && !STOP_WORDS.has(word.toLowerCase()))
        .join(' ')
        .trim())
      .filter(Boolean)
      .map((part) => {
        const match = part.match(QTY);
        if (match) return { text: match[1].trim(), qty: `${match[2]} ${match[3].toLowerCase()}` };
        return { text: part, qty: '' };
      })
      .filter((item) => item.text.length > 1)
      .map((item) => ({
        id: Date.now() + '-' + Math.random().toString(36).slice(2, 7),
        text: item.text.charAt(0).toUpperCase() + item.text.slice(1),
        qty: item.qty,
        done: false,
        ts: Date.now(),
      }));
  }

  // ---------- иконки (нарисованы вручную) ----------
  const ICON_CHECK = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.6 4.6L19 7.6"/></svg>';
  const ICON_X = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>';

  // ---------- рисование ----------
  function row(item) {
    return `
      <li class="item${item.done ? ' done' : ''}" data-id="${item.id}">
        <button class="check" type="button" data-toggle="${item.id}" aria-label="Отметить">${ICON_CHECK}</button>
        <div class="item-text">${escapeHtml(item.text)}${item.qty ? `<span class="item-qty">${escapeHtml(item.qty)}</span>` : ''}</div>
        <button class="item-del" type="button" data-del="${item.id}" aria-label="Удалить">${ICON_X}</button>
      </li>`;
  }

  function render() {
    const open = items.filter((i) => !i.done);
    const done = items.filter((i) => i.done);
    const prevOpen = Number($('#left-count').textContent) || 0;
    const prevDone = Number($('#done-count').textContent) || 0;

    openList.innerHTML = open.map(row).join('');
    doneList.innerHTML = done.map(row).join('');

    emptyEl.classList.toggle('is-hidden', items.length > 0);
    $('#open-section').classList.toggle('is-hidden', open.length === 0);
    $('#done-section').classList.toggle('is-hidden', done.length === 0);
    $('#left-count').textContent = String(open.length);
    $('#done-count').textContent = String(done.length);

    for (const [id, value, previous] of [['#left-count', open.length, prevOpen], ['#done-count', done.length, prevDone]]) {
      const node = $(id);
      if (value !== previous) {
        node.classList.remove('is-bump');
        void node.offsetWidth;
        node.classList.add('is-bump');
      }
    }

    $('#today').textContent = 'сегодня, ' + new Date().toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' });

    clearAllBtn.classList.toggle('is-hidden', items.length === 0);
    if (!items.length) resetClear();

    save();
  }

  function escapeHtml(value) {
    return String(value).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function toast(text) {
    toastEl.textContent = text;
    toastEl.classList.remove('is-hidden');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.add('is-hidden'), 2600);
  }

  const flashEl = $('#flash');
  const flashTitle = $('#flash-title');
  const flashMeta = $('#flash-meta');
  let flashTimer = null;

  function showFlash(title, meta) {
    flashTitle.textContent = title;
    flashMeta.textContent = meta;
    flashEl.classList.remove('is-on');
    void flashEl.offsetWidth;
    flashEl.classList.add('is-on');
    clearTimeout(flashTimer);
    flashTimer = setTimeout(() => flashEl.classList.remove('is-on'), 1700);
  }

  // ---------- действия ----------
  function addItems(raw) {
    const parsed = parseItems(raw);
    if (!parsed.length) {
      toast('Не расслышал — напиши словами');
      return;
    }
    items = items.concat(parsed);
    render();
    if (parsed.length === 1) {
      showFlash(parsed[0].text, parsed[0].qty || 'в список');
    } else {
      const names = parsed.slice(0, 3).map((item) => item.text).join(', ');
      showFlash(`Добавлено: ${parsed.length}`, names + (parsed.length > 3 ? '…' : ''));
    }
  }

  function onListClick(event) {
    const toggle = event.target.closest('[data-toggle]');
    if (toggle) {
      const item = items.find((i) => i.id === toggle.dataset.toggle);
      if (!item) return;
      const rowEl = toggle.closest('.item');
      if (rowEl) rowEl.classList.add('is-leaving');
      setTimeout(() => {
        item.done = !item.done;
        render();
      }, 160);
      return;
    }
    const del = event.target.closest('[data-del]');
    if (del) {
      const rowEl = del.closest('.item');
      if (rowEl) rowEl.classList.add('is-leaving');
      setTimeout(() => {
        items = items.filter((i) => i.id !== del.dataset.del);
        render();
      }, 150);
    }
  }

  openList.addEventListener('click', onListClick);
  doneList.addEventListener('click', onListClick);

  $('#clear-done').addEventListener('click', () => {
    items = items.filter((i) => !i.done);
    render();
    toast('Убрал купленное');
  });

  const clearAllBtn = $('#clear-all');
  let clearArmed = false;
  let clearTimer = null;

  function resetClear() {
    clearArmed = false;
    if (clearTimer) { clearTimeout(clearTimer); clearTimer = null; }
    clearAllBtn.classList.remove('armed');
    clearAllBtn.textContent = 'очистить весь список';
  }

  clearAllBtn.addEventListener('click', () => {
    if (!clearArmed) {
      clearArmed = true;
      clearAllBtn.classList.add('armed');
      clearAllBtn.textContent = 'точно очистить? нажми ещё раз';
      clearTimer = setTimeout(resetClear, 3200);
      return;
    }
    items = [];
    resetClear();
    render();
    toast('Список очищен');
  });

  inputEl.addEventListener('keydown', (event) => {
    if (event.key !== 'Enter') return;
    event.preventDefault();
    const value = inputEl.value.trim();
    if (!value) return;
    inputEl.value = '';
    addItems(value);
  });

  $('#share').addEventListener('click', async () => {
    const open = items.filter((i) => !i.done);
    if (!open.length) { toast('Список пуст'); return; }
    const text = 'Покупки:\n' + open.map((i) => `— ${i.text}${i.qty ? ' ' + i.qty : ''}`).join('\n');
    try {
      if (navigator.share) { await navigator.share({ title: 'Покупки', text }); return; }
      await navigator.clipboard.writeText(text);
      toast('Список скопирован — вставляй в сообщение');
    } catch (e) {
      try { await navigator.clipboard.writeText(text); toast('Список скопирован'); } catch (e2) { toast(text); }
    }
  });

  // ---------- голос: нажал — говоришь, нажал ещё — стоп ----------
  let recognition = null;
  let listening = false;
  let transcript = '';
  let micError = '';

  function ensureRecognition() {
    const Ctor = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!Ctor) return null;
    if (recognition) return recognition;
    recognition = new Ctor();
    recognition.lang = 'ru-RU';
    recognition.continuous = true;
    recognition.interimResults = true;
    recognition.onresult = (event) => {
      let interim = '';
      let final = '';
      for (let i = event.resultIndex; i < event.results.length; i += 1) {
        const result = event.results[i];
        if (result.isFinal) final += result[0].transcript;
        else interim += result[0].transcript;
      }
      if (final) transcript = (transcript + ' ' + final).trim();
      $('#listen-text').textContent = transcript || interim || 'Например: «молоко, хлеб, сыр»';
    };
    recognition.onerror = (event) => { micError = event.error || 'unknown'; };
    recognition.onend = () => finish();
    return recognition;
  }

  function start() {
    if (listening) return;
    if (!ensureRecognition()) {
      toast('Safari не умеет слушать — напиши словами');
      inputEl.focus();
      return;
    }
    transcript = '';
    micError = '';
    listening = true;
    micBtn.classList.add('listening');
    overlay.classList.remove('is-hidden');
    $('#listen-title').textContent = 'Говорите…';
    $('#listen-text').textContent = 'Например: «молоко, хлеб, сыр»';
    try { recognition.start(); } catch (e) { finish(); }
  }

  function stop() {
    if (!listening) return;
    try { recognition.stop(); } catch (e) { finish(); }
  }

  function finish() {
    if (!listening) return;
    listening = false;
    micBtn.classList.remove('listening');
    overlay.classList.add('is-hidden');
    const text = transcript.trim();
    transcript = '';
    if (!text) {
      if (micError === 'not-allowed' || micError === 'service-not-allowed') toast('Разреши микрофон в настройках Safari');
      else if (micError !== 'aborted') toast('Не расслышал — попробуй ещё раз');
      return;
    }
    addItems(text);
  }

  micBtn.addEventListener('click', () => { if (listening) stop(); else start(); });
  $('#done').addEventListener('click', stop);
  $('#cancel').addEventListener('click', () => { micError = 'aborted'; transcript = ''; stop(); });
  document.addEventListener('keydown', (event) => { if (event.key === 'Escape' && listening) { micError = 'aborted'; stop(); } });

  // ---------- примеры и запуск ----------
  $('#examples').innerHTML = EXAMPLES.map((phrase) => `<button class="example" type="button" data-phrase="${phrase}">${phrase}</button>`).join('');
  $('#examples').addEventListener('click', (event) => {
    const button = event.target.closest('[data-phrase]');
    if (button) addItems(button.dataset.phrase);
  });

  render();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
  }
})();
</script>
</body>
</html>
